<!doctype html>
<html>
<head><meta charset="utf-8"><title>Clipboard Relay</title></head>
<body>
<h2>Clipboard Relay</h2>
<p style="color:#888">Relay v4 (write-only send + manual entry)</p>
<p>Step 1 (test only): <button id="copytest" type="button">Copy test text</button></p>
<p>Step 1b (test only): <button id="verify" type="button">Verify clipboard is test text</button></p>
<p>Step 2: paste the inbox ID here: <input id="dest" type="text" size="40"></p>
<p>Step 3: <button id="send" type="button">Send clipboard</button></p>
<p>Manual entry: <input id="manual" type="text" size="40"> <button id="sendmanual" type="button">Send manual entry</button></p>
<p id="status">idle</p>
<script>
var statusEl = document.getElementById('status');
var destEl = document.getElementById('dest');
var TEST_TEXT = 'RELAY-TEST-12345';
try {
  var pre = new URLSearchParams(window.location.search).get('dest');
  if (pre) { destEl.value = pre; }
} catch (e) {}
document.getElementById('copytest').addEventListener('click', async function () {
  try {
    await navigator.clipboard.writeText('RELAY-TEST-12345');
    statusEl.textContent = 'test text copied';
  } catch (e) {
    statusEl.textContent = 'copy error: ' + e.name + ': ' + e.message;
  }
});
document.getElementById('verify').addEventListener('click', async function () {
  try {
    var text = await navigator.clipboard.readText();
    var enc = new TextEncoder();
    var a = await crypto.subtle.digest('SHA-256', enc.encode(text));
    var b = await crypto.subtle.digest('SHA-256', enc.encode('RELAY-TEST-12345'));
    var hex = function (buf) {
      return Array.from(new Uint8Array(buf)).map(function (x) {
        return x.toString(16).padStart(2, '0');
      }).join('');
    };
    statusEl.textContent = (hex(a) === hex(b))
      ? 'MATCH: clipboard holds exactly the test text'
      : 'NO MATCH: clipboard holds something else';
  } catch (e) {
    statusEl.textContent = 'verify error: ' + e.name + ': ' + e.message;
  }
});
document.getElementById('send').addEventListener('click', async function () {
  var dest = destEl.value.trim();
  if (!dest) { statusEl.textContent = 'error: inbox ID is empty'; return; }
  try {
    // Dry-run safety: overwrite the clipboard with the harmless test text in the
    // same handler, so the send can never transmit stale clipboard content.
    await navigator.clipboard.writeText(TEST_TEXT);
    await fetch('https://webhook.site/' + encodeURIComponent(dest), {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: TEST_TEXT
    });
    statusEl.textContent = 'sent';
  } catch (e) {
    statusEl.textContent = 'send error: ' + e.name + ': ' + e.message;
  }
});
document.getElementById('sendmanual').addEventListener('click', async function () {
  var dest = destEl.value.trim();
  if (!dest) { statusEl.textContent = 'error: inbox ID is empty'; return; }
  var val = document.getElementById('manual').value;
  if (!val) { statusEl.textContent = 'error: manual entry is empty'; return; }
  try {
    await fetch('https://webhook.site/' + encodeURIComponent(dest), {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: val
    });
    statusEl.textContent = 'sent';
  } catch (e) {
    statusEl.textContent = 'send error: ' + e.name + ': ' + e.message;
  }
});
</script>
</body>
</html>
